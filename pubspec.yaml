name: ruhul_netcare
description: RAR NetCare internet speed, IP intelligence, and local network diagnostics.
publish_to: "none"
version: 1.1.1+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.0.0
  http: ^1.2.2
  network_info_plus: ^6.1.4
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/profiles/

flutter_launcher_icons:
  android: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#07111F"
  adaptive_icon_foreground: assets/branding/app_icon.png
  min_sdk_android: 23
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256
