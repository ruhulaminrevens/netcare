name: Build and publish release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rar-netcare-v1-1-release
  cancel-in-progress: true

env:
  APP_VERSION: 1.1.0
  FLUTTER_CHANNEL: stable

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Generate platform scaffolding
        run: flutter create . --project-name ruhul_netcare --org com.ruhulaminrevens --platforms=android
      - name: Install packages
        run: flutter pub get
      - name: Format source
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test

  android:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Generate Android scaffolding
        run: flutter create . --project-name ruhul_netcare --org com.ruhulaminrevens --platforms=android
      - run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Build universal and smaller device-specific APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/RAR-NetCare-${APP_VERSION}-android-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/RAR-NetCare-${APP_VERSION}-android-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/RAR-NetCare-${APP_VERSION}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/RAR-NetCare-${APP_VERSION}-android-x86_64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Build Windows installer
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Enable Windows build
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create . --project-name ruhul_netcare --org com.ruhulaminrevens --platforms=windows
          flutter pub get
          dart run flutter_launcher_icons
          $main = Get-Content "windows/runner/main.cpp" -Raw
          $main = $main.Replace('L"ruhul_netcare"', 'L"RAR NetCare"')
          Set-Content "windows/runner/main.cpp" $main
      - name: Build Windows app
        run: flutter build windows --release
      - name: Create portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/RAR-NetCare-${env:APP_VERSION}-windows-portable.zip" -Force
      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found" }
          "compiler=$compiler" >> $env:GITHUB_OUTPUT
      - name: Build EXE installer
        shell: pwsh
        run: '& "${{ steps.inno.outputs.compiler }}" installer/windows/netcare.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-files
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish v1.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          target_commitish: main
          name: RAR NetCare v1.1.0
          body_path: RELEASE_NOTES.md
          prerelease: false
          make_latest: true
          files: |
            release-files/*
