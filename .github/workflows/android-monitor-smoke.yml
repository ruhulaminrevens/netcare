name: Verify Android APK upgrade
on:
  push:
    branches: [android-monitor-device-check]
concurrency:
  group: signed-android-monitor-smoke
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch signed build and previous ARM64 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_sha=$(git log -1 --format=%H -- lib/monitor/android_monitor.dart)
          run_id=$(gh run list --workflow android-monitor.yml --commit "$build_sha" --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          gh run watch "$run_id" --exit-status --interval 20
          gh run download "$run_id" -n android-apk -D signed
          gh release download v1.1.2 -p '*android-arm64.apk' -D previous
          echo '6f8cc034fa7d44eee814579480fb4c22586b68782c3a9c9505256104a1554674  previous/RAR-NetCare-1.1.2-android-arm64.apk' | sha256sum -c -
          tools_dir=$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)
          for dir in previous signed; do
            "$tools_dir/apksigner" verify --print-certs "$dir"/*.apk | grep 'certificate SHA-256 digest:' > "$dir/cert.txt"
            "$tools_dir/aapt" dump badging "$dir"/*.apk | grep -E "^package:|^native-code:"
          done
          diff previous/cert.txt signed/cert.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell getprop ro.product.cpu.abilist
            adb install previous/*.apk
            adb shell am start -W -n com.ruhulaminrevens.ruhul_netcare/.MainActivity
            sleep 5
            adb shell pidof com.ruhulaminrevens.ruhul_netcare || adb logcat -b crash -d -t 80
            adb shell am force-stop com.ruhulaminrevens.ruhul_netcare
            adb logcat -c
            adb install -r signed/*.apk
            python3 .github/scripts/android_monitor_smoke.py
